name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ \
            libcli11-dev nlohmann-json3-dev \
            libfmt-dev libspdlog-dev libyaml-cpp-dev \
            catch2

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DDOCKTRACE_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Run unit + e2e tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test the CLI against the sample report
        run: |
          ./build/docktrace report --input examples/sample-report.json --summary
          ./build/docktrace profile --input examples/sample-report.json --format oci-seccomp --strictness conservative -o /tmp/seccomp.json
          ./build/docktrace validate --input /tmp/seccomp.json --format oci-seccomp
          ./build/docktrace doctor
