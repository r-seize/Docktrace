name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package and release (e.g. v0.1.1)"
        required: true

jobs:
  package:
    strategy:
      # One arch hitting a transient failure (e.g. a flaky download) should
      # not cancel the other arch's build — each should get its own chance
      # to produce and upload its artifacts.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ \
            libcli11-dev nlohmann-json3-dev \
            libfmt-dev libspdlog-dev libyaml-cpp-dev

      - name: Configure and build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DDOCKTRACE_ENABLE_TESTS=OFF
          cmake --build build --parallel "$(nproc)"

      - name: Package .deb
        run: |
          cd build
          cpack

      - name: Checksums
        run: |
          cd build
          sha256sum docktrace-*-Linux.deb > docktrace-${{ matrix.arch }}.sha256

      # Best-effort: this step downloads the syft binary from GitHub
      # Releases, which occasionally returns a transient 5xx. The SBOM is
      # supplementary to the .deb/checksums, so a flaky download here must
      # not block the actual package from being released.
      - name: Generate SBOM (CycloneDX)
        id: sbom
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-${{ matrix.arch }}.cdx.json

      # NOTE: artifacts are not signed in this workflow (no Sigstore/cosign
      # identity configured for this project yet). See CHANGELOG.md and
      # THREAT-MODEL.md — signing is a tracked follow-up, not silently
      # skipped.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docktrace-${{ matrix.arch }}
          # If the SBOM step above failed, its file just won't exist — that's
          # expected and fine, not an error for this step.
          if-no-files-found: warn
          path: |
            build/docktrace-*-Linux.deb
            build/docktrace-${{ matrix.arch }}.sha256
            sbom-${{ matrix.arch }}.cdx.json

  release:
    needs: package
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only unless granted write access here —
    # without this, creating/updating the release fails with "Resource not
    # accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # No `body`/`generate_release_notes` on purpose: the release
      # description is written by hand on GitHub and must not be
      # overwritten by this workflow. If the release for this tag already
      # exists, only its assets are updated; its description is left as-is.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/**/*
